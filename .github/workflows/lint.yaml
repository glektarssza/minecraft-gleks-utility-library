# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference to run the workflow on.

          Must be a valid commit-ish (a branch, tag, commit, etc.).

          Defaults to the reference that triggered the workflow for push and
          pull request events ("github.ref") and the head SHA ("github.sha") for
          all other events.
        type: string
        required: false
        default: ${{github.ref || github.sha || github.event.repository.default_branch}}
      java-vendor:
        description: |
          The Java vendor to use.

          Defaults to 'temurin'.
        type: string
        required: false
        default: temurin
      java-version:
        description: |
          The Java version to use.

          Defaults to 'version-file' to use the version found in the
          '.java-version' file present in the project.
        type: string
        required: false
        default: version-file
      gradle-version:
        description: |
          The Gradle version to use.

          Defaults to 'wrapper' to use version of the Gradle wrapper present in
          the project.
        type: string
        required: false
        default: wrapper
    secrets:
      github-token:
        description: |
          The token to use for authentication when making calls to the GitHub
          APIs.

          Defaults to the value in "secrets.GITHUB_TOKEN" if not provided.
        required: false
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      # -- Needed to clone the repository
      contents: read
    steps:
      - id: clone-repository
        name: Clone the repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
      - id: prepare-python
        name: Prepare Python
        uses: actions/setup-python@v7
        with:
          python-version: '>=3'
      - id: read-java-version
        name: Read Java version
        shell: bash
        run: |
          if [[ "${{inputs.java-version}}" -eq "version-file" ]]; then
            if [[ -f ".java-version" ]]; then
              echo "Will be using Java version $(cat .java-version)";
              echo "java-version=$(cat .java-version)" >> "$GITHUB_OUTPUT";
            else
              echo "::error file=.github\workflows\build.yaml,line=96,endLine=96,title=Missing ``.java-version`` file::No ``.java-version`` file found in the repository but workflow action requested to use it as the source of a Java version to use!";
              exit 1;
            fi
          elif [[ -z "${{inputs.java-version}}" ]]; then
              echo "::error file=.github\workflows\build.yaml,line=100,endLine=100,title=Missing Java version::No Java version given to build workflow!";
              exit 1;
          else
            echo "java-version=${{inputs.java-version}}" >> "$GITHUB_OUTPUT"
          fi
      - id: setup-java
        name: Setup Java
        uses: actions/setup-java@v6
        with:
          token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
          distribution: ${{inputs.java-vendor}}
          java-version: ${{steps.read-java-version.outputs.java-version}}
      - id: setup-gradle
        name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          github-token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
          gradle-version: ${{inputs.gradle-version}}
          cache-cleanup: on-success
          gradle-home-cache-cleanup: true
      - id: install-pre-commit
        name: Install pre-commit
        run: |
          ./scripts/install-pre-commit.sh --force
      - id: setup-ci-workspace
        name: Setup CI Workspace
        run: ./gradlew setupCIWorkspace
      - id: lint
        name: Lint
        run: |
          pre-commit run --all-files
