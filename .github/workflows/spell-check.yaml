# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Spell Check
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference to run the workflow on.

          Must be a valid commit-ish (a branch, tag, commit, etc.).

          Defaults to the reference that triggered the workflow for push and
          pull request events ("github.ref") and the head SHA ("github.sha") for
          all other events.
        type: string
        required: false
        default: ${{github.sha || github.ref || github.event.repository.default_branch}}
      node-version:
        description: |
          The NodeJS version to use.

          Defaults to "latest".
        type: string
        required: false
        default: latest
      package-manager:
        description: |
          The NodeJS package manager to use.

          Defaults to "pnpm".
        type: string
        required: false
        default: pnpm
      package-manager-version:
        description: |
          The NodeJS package manager version to use.

          Defaults to "latest".
        type: string
        required: false
        default: latest
    secrets:
      github-token:
        description: |
          The token to use for authentication when making calls to the GitHub
          APIs.

          Defaults to the value in "secrets.GITHUB_TOKEN" if not provided.
        required: false
jobs:
  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    permissions:
      # -- To clone repository
      contents: read
    steps:
      - id: checkout-repository
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          submodules: recursive
          token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
      - id: setup-pnpm-package-manager
        name: Setup NodeJS Package Manager
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6
        with:
          version: ${{inputs.package-manager-version}}
          run_install: false
          standalone: false
      - id: setup-nodejs
        name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          token: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
          node-version: ${{inputs.node-version}}
      - id: setup-non-pnpm-package-manager
        name: Setup NodeJS Package Manager
        if: inputs.package-manager != 'pnpm'
        run: |
          npm install -g ${{inputs.package-manager}}@${{inputs.package-manager-version}}
      - id: install-cspell
        name: Install CSpell
        run: |
          ${{inputs.package-manager}} install -g cspell \
          @cspell/dict-cspell-bundle @cspell/dict-java @cspell/dict-fonts \
          @cspell/dict-public-licenses @cspell/dict-gaming-terms \
          @cspell/dict-companies @cspell/dict-git @cspell/dict-software-terms;
      - id: check-spelling
        name: Check Spelling
        run: |
          cspell lint --root ${{github.workspace}} --no-color --no-cache \
            --stop-config-search-at ${{github.workspace}} --no-progress \
            --no-must-find-files --gitignore-root ${{github.workspace}} .
      - id: remove-package-manager
        if: always() && inputs.package-manager != 'pnpm'
        run: |
          npm remove -g ${{inputs.package-manager}}
